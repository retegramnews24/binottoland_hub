<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090d15" />
  <title>Binottoland Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d15;
      --bg-2: #101827;
      --surface: #151d2d;
      --surface-2: #1d2638;
      --line: rgba(255,255,255,.08);
      --text: #f5f7ff;
      --muted: #9aa7c2;
      --purple: #9e7bff;
      --pink: #ff73b5;
      --cyan: #72e7ff;
      --green: #75e7ac;
      --yellow: #ffd166;
      --shadow: 0 16px 34px rgba(0,0,0,.28);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(158,123,255,.18), transparent 22%),
        radial-gradient(circle at bottom right, rgba(114,231,255,.11), transparent 24%),
        var(--bg);
    }

    button, input {
      font: inherit;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      position: relative;
      padding-bottom: 84px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + var(--safe-top)) 16px 12px;
      background: rgba(9,13,21,.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      font-weight: 900;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    #main {
      padding: 16px 16px 10px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn .22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      background: linear-gradient(135deg, rgba(158,123,255,.18), rgba(12,17,26,.94));
      border: 1px solid rgba(158,123,255,.3);
      border-radius: 24px;
      padding: 18px 16px 16px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }

    .hero-kicker {
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 34px);
      line-height: 1.06;
      letter-spacing: -.04em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .hero-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .primary-btn, .secondary-btn, .ghost-btn, .chip {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: white;
      box-shadow: 0 8px 18px rgba(158,123,255,.32);
    }

    .secondary-btn {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .ghost-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 10px;
      font-size: 11px;
    }

    .chip-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .chip-group::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 8px 10px;
      font-size: 11px;
    }

    .chip.active {
      background: rgba(158,123,255,.12);
      border-color: rgba(158,123,255,.35);
      color: var(--text);
    }

    .section {
      margin-top: 26px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .02em;
    }

    .section-head a {
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .quick-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      min-height: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text);
      font-weight: 700;
      font-size: 10px;
      cursor: pointer;
    }

    .quick-btn .icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      font-size: 15px;
    }

    .live-grid,
    .recent-grid,
    .favorite-grid,
    .games-grid,
    .community-grid {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .live-grid,
    .recent-grid,
    .favorite-grid,
    .games-grid {
      grid-template-columns: repeat(3, minmax(0,1fr));
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 10px;
      min-height: 118px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
      position: relative;
      overflow: hidden;
    }

    .card.tv { border-color: rgba(114,231,255,.22); }
    .card.radio { border-color: rgba(117,231,172,.22); }
    .card.game { border-color: rgba(255,114,180,.22); }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    }

    .badge {
      display: inline-block;
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .badge.tv { background: rgba(114,231,255,.12); color: var(--cyan); }
    .badge.radio { background: rgba(117,231,172,.12); color: var(--green); }
    .badge.game { background: rgba(255,114,180,.12); color: var(--pink); }

    .card h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .card .action {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }

    .mini {
      min-height: 104px;
    }

    .mini .meta {
      color: var(--muted);
      font-size: 10px;
      margin-top: 6px;
    }

    .favorite-toggle {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      cursor: pointer;
    }

    .favorite-toggle.active {
      color: var(--yellow);
      border-color: rgba(255,209,102,.4);
      background: rgba(255,209,102,.08);
    }

    .community-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .community-item strong {
      font-size: 13px;
    }

    .community-item p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .community-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .votes {
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -.04em;
    }

    .pill {
      display: inline-block;
      width: fit-content;
      padding: 6px 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .input-row input {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 480px);
      height: 70px;
      background: rgba(10, 13, 21, .96);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 10px calc(12px + var(--safe-bottom));
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--text);
    }

    .nav-btn .nav-icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      font-size: 14px;
    }

    @media (max-width: 380px) {
      .live-grid,
      .recent-grid,
      .favorite-grid,
      .games-grid {
        grid-template-columns: 1fr;
      }

      .quick-grid {
        grid-template-columns: repeat(3, minmax(0,1fr));
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">B</div>
        <span>Binottoland</span>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="settingsBtn" aria-label="Impostazioni">⚙</button>
        <button class="icon-btn" id="alertsBtn" aria-label="Notifiche">🔔</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button class="nav-btn active" data-screen="home"><span class="nav-icon">🏠</span>Home</button>
      <button class="nav-btn" data-screen="tv"><span class="nav-icon">📺</span>TV</button>
      <button class="nav-btn" data-screen="radio"><span class="nav-icon">📻</span>Radio</button>
      <button class="nav-btn" data-screen="games"><span class="nav-icon">🎮</span>Giochi</button>
      <button class="nav-btn" data-screen="community"><span class="nav-icon">👥</span>Community</button>
    </nav>
  </div>

  <script>
    const tg = window.Telegram?.WebApp || null;

    const data = {
      live: [
        { type: 'tv', title: 'BINOTTO LIVE', subtitle: 'Notizie e intrattenimento', badge: 'Live', action: 'Guarda' },
        { type: 'radio', title: 'BINOTTO RADIO', subtitle: 'Musica + talk', badge: 'Ascolta', action: 'Ascolta' },
        { type: 'game', title: 'Moon Lander', subtitle: 'Torneo attivo', badge: 'Giorno', action: 'Gioca' }
      ],
      recent: [
        { type: 'tv', title: 'Canale Binotto', meta: 'Continuato 5 min fa', category: 'TV' },
        { type: 'radio', title: 'Radio Nightwave', meta: 'Ascoltata ieri', category: 'Radio' },
        { type: 'game', title: '2048 Classic', meta: 'Ultimo punteggio: 1024', category: 'Gioco' }
      ],
      favoritesSeed: [
        { type: 'tv', title: 'TV Binottoland', meta: 'Preferita', category: 'TV' },
        { type: 'radio', title: 'DAB Radio', meta: 'Preferita', category: 'Radio' },
        { type: 'game', title: 'Neon Snake', meta: 'Salvato', category: 'Gioco' }
      ],
      community: [
        { title: 'Proposta del giorno', text: 'Nuovo gioco di puzzle dedicato alla community Binottoland.', votes: 128 },
        { title: 'Evento della settimana', text: 'Torneo Moon Lander aperto a tutti i membri della community.', votes: 89 },
        { title: 'Suggerimento team', text: 'Nuovo canale dedicato a live e contenuti culturali.', votes: 67 }
      ],
      tv: [
        { title: 'Binotto Live', subtitle: 'Notizie, talk, intrattenimento', badge: 'LIVE', type: 'tv' },
        { title: 'Channel 24', subtitle: 'News e aggiornamenti comunitari', badge: 'LIVE', type: 'tv' },
        { title: 'Cultura Hub', subtitle: 'Documentari e approfondimenti', badge: 'NEW', type: 'tv' },
        { title: 'Sport Arena', subtitle: 'Eventi e live sportive', badge: 'LIVE', type: 'tv' },
        { title: 'Music Box', subtitle: 'Video e mix musicali', badge: 'POP', type: 'tv' },
        { title: 'Binotto Stories', subtitle: 'Momenti e contenuti della community', badge: 'HOT', type: 'tv' }
      ],
      radio: [
        { title: 'Binotto Radio', subtitle: 'Musica + talk', badge: 'POP', type: 'radio' },
        { title: 'Nightwave', subtitle: 'Mix, chill, electronic', badge: 'CHILL', type: 'radio' },
        { title: 'City FM', subtitle: 'Top hits e news', badge: 'HITS', type: 'radio' },
        { title: 'Talkzone', subtitle: 'Discussioni e interviste', badge: 'TALK', type: 'radio' },
        { title: 'Lounge 88', subtitle: 'Ambient e jams', badge: 'LOUNGE', type: 'radio' },
        { title: 'Weekend Mix', subtitle: 'Set live e playlist', badge: 'LIVE', type: 'radio' }
      ],
      games: [
        { title: '2048 Classic', subtitle: 'Puzzle classico · 4x4', badge: 'Arcade', type: 'game' },
        { title: 'Moon Lander', subtitle: 'Missioni lunari · casuali', badge: 'Action', type: 'game' },
        { title: 'Neon Snake', subtitle: 'Touch controls · velocità', badge: 'Arcade', type: 'game' },
        { title: 'Tetris', subtitle: 'Combinazioni e line clear', badge: 'Puzzle', type: 'game' },
        { title: 'Memory Grid', subtitle: 'Celebrazione visiva', badge: 'Brain', type: 'game' },
        { title: 'Challenge Run', subtitle: 'Obiettivi quotidiani', badge: 'Daily', type: 'game' }
      ]
    };

    const state = {
      activeScreen: 'home',
      favorites: new Set(['TV Binottoland', 'DAB Radio', 'Neon Snake']),
      filters: {
        tv: 'all',
        radio: 'all',
        games: 'all'
      }
    };

    const main = document.getElementById('main');

    function getFavoriteState(title) {
      return state.favorites.has(title);
    }

    function toggleFavorite(title) {
      if (state.favorites.has(title)) {
        state.favorites.delete(title);
      } else {
        state.favorites.add(title);
      }
      renderScreen();
    }

    function createLiveCard(item) {
      const cardType = item.type === 'tv' ? 'tv' : item.type === 'radio' ? 'radio' : 'game';
      return `
        <article class="card ${cardType}">
          <span class="badge ${cardType}">${item.badge}</span>
          <div>
            <h3>${item.title}</h3>
            <p>${item.subtitle}</p>
          </div>
          <button class="action" data-action="open-${item.type}">${item.action}</button>
        </article>
      `;
    }

    function createItemCard(item, compact = false) {
      const cardType = item.type || 'game';
      const favoriteActive = getFavoriteState(item.title);
      const compactClass = compact ? 'mini' : '';
      return `
        <article class="card ${compactClass} ${cardType}">
          <button class="favorite-toggle ${favoriteActive ? 'active' : ''}" data-favorite="${item.title}" title="Aggiungi ai preferiti">★</button>
          <div>
            <h3>${item.title}</h3>
            <p>${item.subtitle || item.meta}</p>
          </div>
          <div class="meta">${item.badge || item.category || 'Preferito'}</div>
          <button class="action" data-action="open-${item.type || 'game'}">${item.action || 'Apri'}</button>
        </article>
      `;
    }

    function createCommunityCard(item) {
      return `
        <article class="community-item">
          <strong>${item.title}</strong>
          <p>${item.text}</p>
          <div class="community-row">
            <span class="votes">${item.votes} voti</span>
            <button class="ghost-btn">Apri</button>
          </div>
        </article>
      `;
    }

    function renderHome() {
      const liveHtml = data.live.map(createLiveCard).join('');
      const recentHtml = data.recent.map(item => `
        <article class="card mini ${item.type}">
          <div>
            <h3>${item.title}</h3>
            <p>${item.meta}</p>
          </div>
          <div class="meta">${item.category}</div>
        </article>
      `).join('');

      const favoritesHtml = data.favoritesSeed.map(item => `
        <article class="card mini ${item.type}">
          <button class="favorite-toggle ${getFavoriteState(item.title) ? 'active' : ''}" data-favorite="${item.title}" title="Aggiungi ai preferiti">★</button>
          <div>
            <h3>${item.title}</h3>
            <p>${item.meta}</p>
          </div>
          <div class="meta">${item.category}</div>
        </article>
      `).join('');

      const communityHtml = data.community.map(createCommunityCard).join('');

      return `
        <section class="screen active">
          <section class="hero">
            <div class="hero-kicker">Binottoland Hub</div>
            <h1>Il tuo mondo multimediale, in un solo posto.</h1>
            <p>TV live, radio, giochi e community in un unico accesso rapido e pensato per mobile.</p>
            <div class="hero-actions">
              <button class="primary-btn" data-go="tv">Apri TV</button>
              <button class="secondary-btn" data-go="radio">Ascolta radio</button>
              <button class="secondary-btn" data-go="games">Gioca</button>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Accesso rapido</h2>
              <a href="#">Tutto</a>
            </div>
            <div class="quick-grid">
              <button class="quick-btn" data-go="tv"><span class="icon">📺</span>TV</button>
              <button class="quick-btn" data-go="radio"><span class="icon">📻</span>Radio</button>
              <button class="quick-btn" data-go="games"><span class="icon">🎮</span>Giochi</button>
              <button class="quick-btn" data-go="favorites"><span class="icon">⭐</span>Preferiti</button>
              <button class="quick-btn" data-go="community"><span class="icon">👥</span>Community</button>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>In diretta adesso</h2>
              <a href="#">Aggiorna</a>
            </div>
            <div class="live-grid">${liveHtml}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Continua da dove eri rimasto</h2>
              <a href="#">Vedi tutto</a>
            </div>
            <div class="recent-grid">${recentHtml}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Preferiti</h2>
              <a href="#">Gestisci</a>
            </div>
            <div class="favorite-grid">${favoritesHtml}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Community</h2>
              <a href="#">Vota</a>
            </div>
            <div class="community-grid">${communityHtml}</div>
          </section>
        </section>
      `;
    }

    function renderListScreen(kind, items, title, badgeLabel) {
      const chips = ['all', 'live', 'popular', 'new'];
      const activeChip = state.filters[kind] || 'all';
      const chipsHtml = chips.map(chip => `
        <button class="chip ${chip === activeChip ? 'active' : ''}" data-filter-kind="${kind}" data-filter-value="${chip}">${chip === 'all' ? 'Tutti' : chip === 'live' ? 'Live' : chip === 'popular' ? 'Popolari' : 'Novità'}</button>
      `).join('');

      const filtered = items.filter(item => {
        if (activeChip === 'all') return true;
        if (activeChip === 'live') return /live|today|giorno/i.test(item.badge || '');
        if (activeChip === 'popular') return /pop|hits|arcade/i.test(item.badge || '');
        if (activeChip === 'new') return /new|hot|daily|giorno/i.test(item.badge || '');
        return true;
      });

      const cardsHtml = filtered.map(item => createItemCard(item, false)).join('');

      return `
        <section class="screen active">
          <div class="page-header">
            <h1>${title}</h1>
            <span class="pill">${badgeLabel}</span>
          </div>

          <div class="chip-group">${chipsHtml}</div>
          <div class="games-grid">${cardsHtml}</div>
        </section>
      `;
    }

    function renderTV() {
      return renderListScreen('tv', data.tv, 'TV', `${data.tv.length} live`);
    }

    function renderRadio() {
      return renderListScreen('radio', data.radio, 'Radio', `${data.radio.length} stazioni`);
    }

    function renderGames() {
      return renderListScreen('games', data.games, 'Giochi', `${data.games.length} titoli`);
    }

    function renderCommunity() {
      return `
        <section class="screen active">
          <div class="page-header">
            <h1>Community</h1>
            <span class="pill">Attiva</span>
          </div>

          <div class="community-grid">
            ${data.community.map(createCommunityCard).join('')}
          </div>

          <div class="input-row">
            <input type="text" placeholder="Suggerisci un gioco o una proposta..." />
            <button class="primary-btn">Invia</button>
          </div>
        </section>
      `;
    }

    function renderFavorites() {
      const favorites = [
        ...data.favoritesSeed.filter(item => getFavoriteState(item.title)),
        ...data.games.filter(item => getFavoriteState(item.title)),
        ...data.radio.filter(item => getFavoriteState(item.title)),
        ...data.tv.filter(item => getFavoriteState(item.title))
      ];

      const unique = Array.from(new Map(favorites.map(item => [item.title, item])).values());

      if (!unique.length) {
        return `
          <section class="screen active">
            <div class="page-header">
              <h1>Preferiti</h1>
              <span class="pill">0</span>
            </div>
            <div class="empty-panel">Nessun preferito salvato. Aggiungi canali, stazioni o giochi dal cuore.</div>
          </section>
        `;
      }

      return `
        <section class="screen active">
          <div class="page-header">
            <h1>Preferiti</h1>
            <span class="pill">${unique.length}</span>
          </div>
          <div class="favorite-grid">
            ${unique.map(item => `
              <article class="card mini ${item.type || 'game'}">
                <button class="favorite-toggle active" data-favorite="${item.title}" title="Rimuovi dai preferiti">★</button>
                <div>
                  <h3>${item.title}</h3>
                  <p>${item.subtitle || item.meta || 'Salvato'}</p>
                </div>
                <div class="meta">${item.badge || item.category || 'Preferito'}</div>
              </article>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderScreen() {
      let content = renderHome();
      switch (state.activeScreen) {
        case 'tv': content = renderTV(); break;
        case 'radio': content = renderRadio(); break;
        case 'games': content = renderGames(); break;
        case 'community': content = renderCommunity(); break;
        case 'favorites': content = renderFavorites(); break;
        default: content = renderHome();
      }

      main.innerHTML = content;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.screen === state.activeScreen);
      });
    }

    function setScreen(screen) {
      state.activeScreen = screen;
      renderScreen();
    }

    function attachHandlers() {
      document.querySelectorAll('[data-go]').forEach(btn => {
        btn.addEventListener('click', () => setScreen(btn.dataset.go));
      });

      document.querySelectorAll('[data-screen]').forEach(btn => {
        btn.addEventListener('click', () => setScreen(btn.dataset.screen));
      });

      document.addEventListener('click', event => {
        const favoriteButton = event.target.closest('[data-favorite]');
        if (favoriteButton) {
          toggleFavorite(favoriteButton.dataset.favorite);
          return;
        }

        const action = event.target.closest('[data-action]');
        if (!action) return;

        const actionName = action.dataset.action;
        if (actionName === 'open-tv') setScreen('tv');
        if (actionName === 'open-radio') setScreen('radio');
        if (actionName === 'open-game') setScreen('games');
        if (actionName === 'open-community') setScreen('community');
      });

      document.addEventListener('click', event => {
        const filterButton = event.target.closest('[data-filter-kind]');
        if (!filterButton) return;
        const kind = filterButton.dataset.filterKind;
        const value = filterButton.dataset.filterValue;
        state.filters[kind] = value;
        renderScreen();
      });

      document.getElementById('settingsBtn').addEventListener('click', () => {
        if (tg && tg.HapticFeedback) {
          try { tg.HapticFeedback.impactOccurred('light'); } catch (_) {}
        }
        alert('Impostazioni Binottoland');
      });

      document.getElementById('alertsBtn').addEventListener('click', () => {
        alert('Nessuna notifica nuova');
      });
    }

    function initTelegram() {
      if (!tg) return;
      try {
        tg.ready();
        tg.expand();
        tg.setHeaderColor?.('#090d15');
        tg.setBackgroundColor?.('#090d15');
      } catch (_) {}
    }

    initTelegram();
    renderScreen();
    attachHandlers();
  </script>
</body>
</html>
