<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090d15" />
  <title>Binottoland Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d15;
      --bg-2: #101827;
      --surface: #151d2d;
      --surface-2: #1d2638;
      --line: rgba(255,255,255,.08);
      --text: #f5f7ff;
      --muted: #9aa7c2;
      --purple: #9e7bff;
      --pink: #ff73b5;
      --cyan: #72e7ff;
      --green: #75e7ac;
      --yellow: #ffd166;
      --shadow: 0 16px 34px rgba(0,0,0,.28);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(158,123,255,.18), transparent 22%),
        radial-gradient(circle at bottom right, rgba(114,231,255,.11), transparent 24%),
        var(--bg);
    }

    body.module-open { overflow: hidden; }

    button, input { font: inherit; }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      position: relative;
      padding-bottom: 84px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + var(--safe-top)) 16px 12px;
      background: rgba(9,13,21,.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      font-weight: 900;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    #main { padding: 16px 16px 10px; }

    .screen { display: none; }
    .screen.active {
      display: block;
      animation: fadeIn .22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      background: linear-gradient(135deg, rgba(158,123,255,.18), rgba(12,17,26,.94));
      border: 1px solid rgba(158,123,255,.3);
      border-radius: 24px;
      padding: 18px 16px 16px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }

    .hero-kicker {
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 34px);
      line-height: 1.06;
      letter-spacing: -.04em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .primary-btn, .secondary-btn, .ghost-btn, .chip {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: white;
      box-shadow: 0 8px 18px rgba(158,123,255,.32);
    }

    .secondary-btn {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .ghost-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 10px;
      font-size: 11px;
    }

    .chip-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .chip-group::-webkit-scrollbar { display: none; }

    .chip {
      white-space: nowrap;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 8px 10px;
      font-size: 11px;
    }

    .chip.active {
      background: rgba(158,123,255,.12);
      border-color: rgba(158,123,255,.35);
      color: var(--text);
    }

    .section { margin-top: 26px; }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .02em;
    }

    .section-head a {
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .quick-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      min-height: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text);
      font-weight: 700;
      font-size: 10px;
      cursor: pointer;
    }

    .quick-btn .icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      font-size: 15px;
    }

    .live-grid,
    .recent-grid,
    .favorite-grid,
    .games-grid,
    .community-grid {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .live-grid,
    .recent-grid,
    .favorite-grid,
    .games-grid {
      grid-template-columns: repeat(3, minmax(0,1fr));
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.015));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 10px;
      min-height: 118px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, border-color .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(158,123,255,.25);
    }

    .card.tv { border-color: rgba(114,231,255,.22); }
    .card.radio { border-color: rgba(117,231,172,.22); }
    .card.game { border-color: rgba(255,114,180,.22); }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    }

    .badge {
      display: inline-block;
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .badge.tv { background: rgba(114,231,255,.12); color: var(--cyan); }
    .badge.radio { background: rgba(117,231,172,.12); color: var(--green); }
    .badge.game { background: rgba(255,114,180,.12); color: var(--pink); }

    .card h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .card .action {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }

    .mini { min-height: 104px; }
    .mini .meta {
      color: var(--muted);
      font-size: 10px;
      margin-top: 6px;
    }

    .favorite-toggle {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      cursor: pointer;
    }

    .favorite-toggle.active {
      color: var(--yellow);
      border-color: rgba(255,209,102,.4);
      background: rgba(255,209,102,.08);
    }

    .community-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .community-item strong { font-size: 13px; }
    .community-item p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .community-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .votes {
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -.04em;
    }

    .pill {
      display: inline-block;
      width: fit-content;
      padding: 6px 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .media-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: none;
      background: var(--bg);
      z-index: 200;
      overflow: hidden;
    }

    .media-layer.open { display: block; }

    .media-topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: rgba(9,13,21,.8);
      border-bottom: 1px solid var(--line);
      z-index: 2;
    }

    .media-topbar strong {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .media-close {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
    }

    .media-frame {
      position: absolute;
      inset: 58px 0 0 0;
      width: 100%;
      height: calc(100% - 58px);
      border: 0;
      background: #000;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 480px);
      height: 70px;
      background: rgba(10, 13, 21, .96);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 10px calc(12px + var(--safe-bottom));
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10px;
      cursor: pointer;
    }

    .nav-btn.active { color: var(--text); }

    .nav-btn .nav-icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      font-size: 14px;
    }

    body.module-open #app,
    body.module-open .bottom-nav {
      display: none !important;
    }

    @media (max-width: 380px) {
      .live-grid,
      .recent-grid,
      .favorite-grid,
      .games-grid {
        grid-template-columns: 1fr;
      }

      .quick-grid {
        grid-template-columns: repeat(3, minmax(0,1fr));
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">B</div>
        <span>Binottoland</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settingsBtn" aria-label="Impostazioni">⚙</button>
        <button class="icon-btn" id="alertsBtn" aria-label="Notifiche">🔔</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button class="nav-btn active" data-screen="home"><span class="nav-icon">🏠</span>Home</button>
      <button class="nav-btn" data-screen="tv"><span class="nav-icon">📺</span>TV</button>
      <button class="nav-btn" data-screen="radio"><span class="nav-icon">📻</span>Radio</button>
      <button class="nav-btn" data-screen="games"><span class="nav-icon">🎮</span>Giochi</button>
      <button class="nav-btn" data-screen="community"><span class="nav-icon">👥</span>Community</button>
    </nav>
  </div>

  <div class="media-layer" id="tvLayer" aria-label="TV in primo piano">
    <div class="media-topbar">
      <strong>TV LIVE</strong>
      <button class="media-close" id="closeTv">×</button>
    </div>
    <iframe class="media-frame" id="tvFrame" title="TV LIVE"></iframe>
  </div>

  <div class="media-layer" id="radioLayer" aria-label="Radio in primo piano">
    <div class="media-topbar">
      <strong>Radio</strong>
      <button class="media-close" id="closeRadio">×</button>
    </div>
    <iframe class="media-frame" id="radioFrame" title="Radio live"></iframe>
  </div>

  <div class="media-layer" id="gameLayer" aria-label="Gioco in primo piano">
    <div class="media-topbar">
      <strong>Game</strong>
      <button class="media-close" id="closeGame">×</button>
    </div>
    <iframe class="media-frame" id="gameFrame" title="Gioco"></iframe>
  </div>

    function buildRadioDoc(title = 'Binottoland Radio') {
      return `<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;background:#090d15;color:#f5f7ff;font-family:system-ui,sans-serif;overflow:hidden}
    body{display:grid;place-items:center;background:radial-gradient(circle at center, rgba(117,231,172,.12), transparent 28%), #090d15}
    .screen{width:min(100%, 480px);padding:24px 18px 30px;display:grid;gap:14px}
    .player{padding:22px 18px;border-radius:22px;background:linear-gradient(135deg, rgba(117,231,172,.18), rgba(17,24,39,.9));border:1px solid rgba(117,231,172,.25);box-shadow:0 14px 30px rgba(0,0,0,.22)}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(117,231,172,.12);color:#75e7ac;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:14px 0 8px;font-size:clamp(25px, 6.5vw, 36px);letter-spacing:-.04em}
    p{margin:0;color:#9aa7c2;line-height:1.6}
    .viz{height:90px;border-radius:16px;background:linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);display:flex;align-items:end;gap:4px}
    .viz span{display:block;flex:1;height:18%;border-radius:999px 999px 0 0;background:linear-gradient(180deg, #72e7ff, #75e7ac)}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{appearance:none;border:none;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
    .primary{background:linear-gradient(135deg,#75e7ac,#72e7ff);color:#08120d}
    .secondary{background:rgba(255,255,255,.04);color:#fff;border:1px solid rgba(255,255,255,.08)}
  </style>
</head>
<body>
  <div class="screen">
    <div class="player">
      <span class="badge">Streaming</span>
      <h1>${title}</h1>
      <p>Mix di musica, notizie e contenuti in diretta per la community Binottoland.</p>
      <div class="viz" aria-label="Audio visualizer">
        <span style="height:26%"></span>
        <span style="height:58%"></span>
        <span style="height:42%"></span>
        <span style="height:76%"></span>
        <span style="height:48%"></span>
        <span style="height:88%"></span>
        <span style="height:64%"></span>
        <span style="height:52%"></span>
      </div>
      <div class="controls">
        <button class="primary" onclick="window.parent.postMessage({type:'hub-close-media'}, '*')">Chiudi</button>
        <button class="secondary">Preferito</button>
      </div>
    </div>
  </div>
</body>
</html>`;
    }

    function createLiveCard(item) {
      const cardType = item.type === 'tv' ? 'tv' : item.type === 'radio' ? 'radio' : 'game';
      return `
        <article class="card ${cardType}">
          <span class="badge ${cardType}">${item.badge}</span>
          <div>
            <h3>${item.title}</h3>
            <p>${item.subtitle}</p>
          </div>
          <button class="action" data-action="open-${item.type}">${item.action}</button>
        </article>
      `;
    }

    function createItemCard(item) {
      const cardType = item.type || 'game';
      const fav = state.favorites.has(item.title);
      return `
        <article class="card ${cardType}">
          <button class="favorite-toggle ${fav ? 'active' : ''}" data-favorite="${item.title}" title="Aggiungi ai preferiti">★</button>
          <div>
            <h3>${item.title}</h3>
            <p>${item.subtitle || item.meta || 'Salvato'}</p>
          </div>
          <div class="meta">${item.badge || item.category || 'Preferito'}</div>
          <button class="action" data-action="open-${item.type || 'game'}">${item.action || 'Apri'}</button>
        </article>
      `;
    }

    function createCommunityCard(item) {
      return `
        <article class="community-item">
          <strong>${item.title}</strong>
          <p>${item.text}</p>
          <div class="community-row">
            <span class="votes">${item.votes} voti</span>
            <button class="ghost-btn">Apri</button>
          </div>
        </article>
      `;
    }

    function renderHome() {
      const liveHtml = data.live.map(createLiveCard).join('');
      const recentHtml = data.recent.map(item => `
        <article class="card mini ${item.type}">
          <div>
            <h3>${item.title}</h3>
            <p>${item.meta}</p>
          </div>
          <div class="meta">${item.category}</div>
        </article>
      `).join('');

      const favoritesSeed = data.favoritesSeed.map(item => `
        <article class="card mini ${item.type}">
          <button class="favorite-toggle ${state.favorites.has(item.title) ? 'active' : ''}" data-favorite="${item.title}" title="Aggiungi ai preferiti">★</button>
          <div>
            <h3>${item.title}</h3>
            <p>${item.meta}</p>
          </div>
          <div class="meta">${item.category}</div>
        </article>
      `).join('');

      return `
        <section class="screen active">
          <section class="hero">
            <div class="hero-kicker">Binottoland Hub</div>
            <h1>Il tuo mondo multimediale, in un solo posto.</h1>
            <p>TV live, radio, giochi e community in un unico accesso rapido e pensato per mobile.</p>
            <div class="hero-actions">
              <button class="primary-btn" data-go="tv">Apri TV</button>
              <button class="secondary-btn" data-go="radio">Ascolta radio</button>
              <button class="secondary-btn" data-go="games">Gioca</button>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Accesso rapido</h2>
              <a href="#">Tutto</a>
            </div>
            <div class="quick-grid">
              <button class="quick-btn" data-go="tv"><span class="icon">📺</span>TV</button>
              <button class="quick-btn" data-go="radio"><span class="icon">📻</span>Radio</button>
              <button class="quick-btn" data-go="games"><span class="icon">🎮</span>Giochi</button>
              <button class="quick-btn" data-go="favorites"><span class="icon">⭐</span>Preferiti</button>
              <button class="quick-btn" data-go="community"><span class="icon">👥</span>Community</button>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>In diretta adesso</h2>
              <a href="#">Aggiorna</a>
            </div>
            <div class="live-grid">${liveHtml}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Continua da dove eri rimasto</h2>
              <a href="#">Vedi tutto</a>
            </div>
            <div class="recent-grid">${recentHtml}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Preferiti</h2>
              <a href="#">Gestisci</a>
            </div>
            <div class="favorite-grid">${favoritesSeed}</div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2>Community</h2>
              <a href="#">Vota</a>
            </div>
            <div class="community-grid">${data.community.map(createCommunityCard).join('')}</div>
          </section>
        </section>
      `;
    }

    function renderListScreen(kind, items, title, badgeLabel) {
      const chips = ['all', 'live', 'popular', 'new'];
      const activeChip = state.filters[kind] || 'all';
      const chipsHtml = chips.map(chip => `
        <button class="chip ${chip === activeChip ? 'active' : ''}" data-filter-kind="${kind}" data-filter-value="${chip}">${chip === 'all' ? 'Tutti' : chip === 'live' ? 'Live' : chip === 'popular' ? 'Popolari' : 'Nuovi'}</button>
      `).join('');

      const filtered = items.filter(item => {
        if (activeChip === 'all') return true;
        if (activeChip === 'live') return /live|today|giorno/i.test(item.badge || '');
        if (activeChip === 'popular') return /pop|hits|arcade/i.test(item.badge || '');
        if (activeChip === 'new') return /new|hot|daily|giorno/i.test(item.badge || '');
        return true;
      });

      return `
        <section class="screen active">
          <div class="page-header">
            <h1>${title}</h1>
            <span class="pill">${badgeLabel}</span>
          </div>
          <div class="chip-group">${chipsHtml}</div>
          <div class="games-grid">${filtered.map(createItemCard).join('')}</div>
        </section>
      `;
    }

    function renderTV() { return renderListScreen('tv', data.tv, 'TV', `${data.tv.length} live`); }
    function renderRadio() { return renderListScreen('radio', data.radio, 'Radio', `${data.radio.length} stazioni`); }
    function renderGames() { return renderListScreen('games', data.games, 'Giochi', `${data.games.length} titoli`); }

    function renderCommunity() {
      return `
        <section class="screen active">
          <div class="page-header">
            <h1>Community</h1>
            <span class="pill">Vota</span>
          </div>
          <div class="community-grid">${data.community.map(createCommunityCard).join('')}</div>
        </section>
      `;
    }

    function renderScreen() {
      const map = {
        home: renderHome,
        tv: renderTV,
        radio: renderRadio,
        games: renderGames,
        community: renderCommunity
      };

      main.innerHTML = map[state.activeScreen]?.() || renderHome();

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.screen === state.activeScreen);
      });

      document.querySelectorAll('[data-go]').forEach((btn) => {
        btn.addEventListener('click', () => {
          switch (btn.dataset.go) {
            case 'tv': openTV(); break;
            case 'radio': openRadio(); break;
            case 'games': state.activeScreen = 'games'; renderScreen(); break;
            case 'community': state.activeScreen = 'community'; renderScreen(); break;
            case 'favorites': state.activeScreen = 'home'; renderScreen(); break;
            default: state.activeScreen = btn.dataset.go; renderScreen(); break;
          }
        });
      });

      document.querySelectorAll('[data-action]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          if (action === 'open-tv') openTV();
          if (action === 'open-radio') openRadio();
          if (action === 'open-game') {
            state.activeScreen = 'games';
            renderScreen();
          }
        });
      });

      document.querySelectorAll('[data-favorite]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.favorite;
          if (state.favorites.has(key)) state.favorites.delete(key);
          else state.favorites.add(key);
          renderScreen();
        });
      });

      document.querySelectorAll('[data-filter-kind]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const kind = btn.dataset.filterKind;
          const value = btn.dataset.filterValue;
          state.filters[kind] = value;
          renderScreen();
        });
      });
    }

    function openTV() {
      if (!tvFrame.srcdoc) tvFrame.srcdoc = buildTvDoc('TV LIVE Binottoland');
      tvLayer.classList.add('open');
      radioLayer.classList.remove('open');
      gameLayer.classList.remove('open');
      document.body.classList.add('module-open');
    }

    function closeTV() {
      tvLayer.classList.remove('open');
      if (!radioLayer.classList.contains('open') && !gameLayer.classList.contains('open')) {
        document.body.classList.remove('module-open');
      }
    }

    function openRadio() {
      if (!radioFrame.srcdoc) radioFrame.srcdoc = buildRadioDoc('BINOTTO RADIO');
      radioLayer.classList.add('open');
      tvLayer.classList.remove('open');
      gameLayer.classList.remove('open');
      document.body.classList.add('module-open');
    }

    function closeRadio() {
      radioLayer.classList.remove('open');
      if (!tvLayer.classList.contains('open') && !gameLayer.classList.contains('open')) {
        document.body.classList.remove('module-open');
      }
    }

    function closeMedia() {
      closeTV();
      closeRadio();
      gameLayer.classList.remove('open');
      if (!tvLayer.classList.contains('open') && !radioLayer.classList.contains('open')) {
        document.body.classList.remove('module-open');
      }
    }

    document.querySelectorAll('[data-screen]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.screen === 'tv') {
          openTV();
          return;
        }
        if (btn.dataset.screen === 'radio') {
          openRadio();
          return;
        }
        state.activeScreen = btn.dataset.screen;
        renderScreen();
      });
    });

    document.getElementById('closeTv')?.addEventListener('click', closeTV);
    document.getElementById('closeRadio')?.addEventListener('click', closeRadio);
    document.getElementById('closeGame')?.addEventListener('click', () => {
      gameLayer.classList.remove('open');
      if (!tvLayer.classList.contains('open') && !radioLayer.classList.contains('open')) {
        document.body.classList.remove('module-open');
      }
    });

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'hub-close-media') {
        closeMedia();
      }
    });

    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    renderScreen();
  </script>
</body>
</html>
